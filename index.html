<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Clock</title>
    <style>
        :root {
            /* 基礎與卡片顏色 */
            --text-main: #2D4A43;      /* 深森林綠 */
            --text-sub: #6A7B76;       /* 迷霧綠灰 */
            --card-bg: #FFFFFF;

            /* 各階段專屬動態配色（背景色 / 標籤色） */
            --bg-idle: #F7F5F0;        /* 初始/準備：暖米白 */
            --badge-idle: #E3DEC3;

            --bg-storage: #FFF9EE;     /* 蓄力期：柔和淡黃 */
            --badge-storage: #EAD0A8;

            --bg-focus: #EBF2EB;       /* 專注期：清新草木綠 */
            --badge-focus: #8FA382;

            --bg-flow: #DCEBE6;        /* 心流期：深邃青綠 */
            --badge-flow: #4D8071;

            --bg-break: #EDF2F7;       /* 休息期：靜謐冰藍 */
            --badge-break: #7AA0C9;

            --bg-alarm: #FAF0F0;       /* 鬧鈴響起：淡粉紅 */
            --badge-alarm: #C97A7A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-idle);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(45, 74, 67, 0.04);
        }

        h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        /* 狀態標籤 */
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            background-color: var(--badge-idle);
            color: var(--text-main);
            margin-bottom: 25px;
            transition: all 0.5s ease;
            letter-spacing: 0.05em;
        }

        /* 計時器數字 */
        .timer-display {
            font-size: 4.8rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            margin-bottom: 40px;
            color: var(--text-main);
        }

        /* 按鈕樣式 */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            box-shadow: 0 4px 12px rgba(45, 74, 67, 0.08);
        }

        .btn-primary {
            background-color: var(--text-main);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: #1E332E;
        }

        .btn-secondary {
            background-color: #E6DFD3;
            color: var(--text-main);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background-color: #DBD3C5;
        }

        .btn-alarm {
            background-color: #C27D74;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 4px 20px rgba(194, 125, 116, 0.4); }
            100% { transform: scale(1); }
        }

        /* 數據統計面板 */
        .stats-panel {
            margin-top: 40px;
            border-top: 1px solid #EFECE6;
            padding-top: 24px;
            display: flex;
            justify-content: space-around;
        }

        .stat-box {
            flex: 1;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .stat-val span {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 400;
            margin-left: 2px;
            margin-right: 4px;
        }

        .stat-lbl {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 今日歷史紀錄明細 */
        .history-section {
            margin-top: 24px;
            border-top: 1px dashed #EFECE6;
            padding-top: 20px;
            text-align: left;
        }

        .history-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .history-list {
            list-style: none;
            max-height: 140px;
            overflow-y: auto;
            padding: 0 4px;
        }

        .history-item {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #FDFDFD;
            color: var(--text-main);
        }

        .history-time {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .history-detail {
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        /* 隱藏元素 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tree Clock</h1>

        <div id="statusBadge" class="status-badge">準備專注</div>
        <div id="timerDisplay" class="timer-display">00:00</div>

        <button id="btnStartFocus" class="btn btn-primary">開始專注</button>
        <button id="btnEndFocus" class="btn btn-secondary hidden">結束專注</button>
        <button id="btnStopAlarm" class="btn btn-alarm hidden">關閉提示 / 新專注</button>
        <button id="btnSkipBreak" class="btn btn-secondary hidden">跳過休息</button>

        <div class="stats-panel">
            <div class="stat-box">
                <div id="todayFocus" class="stat-val">0<span>m</span></div>
                <div class="stat-lbl">今日專注</div>
            </div>
            <div class="stat-box">
                <div id="todayFlow" class="stat-val">0<span>m</span></div>
                <div class="stat-lbl">今日心流</div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">— 今日專注紀錄 —</div>
            <ul id="historyList" class="history-list">
                </ul>
        </div>
    </div>

    <script>
        // --- 狀態定義 ---
        const STATE = {
            IDLE: 'IDLE',
            FOCUS: 'FOCUS',
            BREAK: 'BREAK',
            ALARM: 'ALARM'
        };

        let currentState = STATE.IDLE;
        let startTime = null;           
        let sessionStartDateTime = null;
        let elapsedSeconds = 0; 
        let breakTotalSeconds = 0;
        let timerWorker = null;
        
        // 音訊控制變數
        let audioCtx = null;
        let alarmInterval = null;
        let keepAliveOsc = null;
        let keepAliveGain = null;

        // --- DOM 元素 ---
        const statusBadge = document.getElementById('statusBadge');
        const timerDisplay = document.getElementById('timerDisplay');
        const btnStartFocus = document.getElementById('btnStartFocus');
        const btnEndFocus = document.getElementById('btnEndFocus');
        const btnStopAlarm = document.getElementById('btnStopAlarm');
        const btnSkipBreak = document.getElementById('btnSkipBreak');
        const todayFocusEl = document.getElementById('todayFocus');
        const todayFlowEl = document.getElementById('todayFlow');
        const historyListEl = document.getElementById('historyList');

        // --- 初始化 Web Worker (防 Safari 背景暫停) ---
        const workerCode = `
            let timerId = null;
            self.onmessage = function(e) {
                if (e.data === 'start') {
                    if (timerId) clearInterval(timerId);
                    timerId = setInterval(() => { self.postMessage('tick'); }, 1000);
                } else if (e.data === 'stop') {
                    clearInterval(timerId);
                    timerId = null;
                }
            };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        timerWorker = new Worker(URL.createObjectURL(blob));
        timerWorker.onmessage = function() {
            handleTick();
        };

        // --- Safari/iPadOS 音訊解鎖與建置 ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // iPadOS 關鍵修復：在倒數階段持續播放極微弱的 sub-audible 訊號，防止 iOS 睡眠關閉網頁音訊通道
        function startAudioKeepAlive() {
            if (!audioCtx) return;
            try {
                stopAudioKeepAlive(); // 確保不重複建立
                keepAliveOsc = audioCtx.createOscillator();
                keepAliveGain = audioCtx.createGain();
                
                keepAliveOsc.frequency.setValueAtTime(1, audioCtx.currentTime); // 1Hz 超低頻
                keepAliveGain.gain.setValueAtTime(0.0001, audioCtx.currentTime); // 極低音量，實測完全靜音但能保持通道 active
                
                keepAliveOsc.connect(keepAliveGain);
                keepAliveGain.connect(audioCtx.destination);
                keepAliveOsc.start();
            } catch(e) {
                console.log("Keep-alive active node failed:", e);
            }
        }

        function stopAudioKeepAlive() {
            if (keepAliveOsc) {
                try { keepAliveOsc.stop(); } catch(e){}
                keepAliveOsc = null;
            }
        }

        function playNaturalChime() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // 播放清脆的和弦自然聲音
            triggerTone(392.00, now, 0.15);      // G4
            triggerTone(523.25, now + 0.1, 0.15); // C5
            triggerTone(659.25, now + 0.2, 0.2);  // E5
            triggerTone(783.99, now + 0.3, 0.4);  // G5
        }

        function triggerTone(freq, time, duration) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, time);
            gainNode.gain.setValueAtTime(0.18, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + duration);
        }

        function startAlarmLoop() {
            stopAlarmLoop();
            playNaturalChime();
            alarmInterval = setInterval(playNaturalChime, 2500); // 每 2.5 秒輪播提示
        }

        function stopAlarmLoop() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // --- 核心計時與 UI 配色變更邏輯 ---
        function handleTick() {
            const now = Date.now();
            
            if (currentState === STATE.FOCUS) {
                elapsedSeconds = Math.floor((now - startTime) / 1000);
                updateFocusUI();
            } else if (currentState === STATE.BREAK) {
                const totalElapsed = Math.floor((now - startTime) / 1000);
                const remaining = breakTotalSeconds - totalElapsed;
                
                if (remaining <= 0) {
                    transitionToAlarm();
                } else {
                    displayTime(remaining);
                }
            }
        }

        function updateFocusUI() {
            displayTime(elapsedSeconds);
            const minutes = elapsedSeconds / 60;

            if (minutes < 8) {
                statusBadge.innerText = '蓄力期';
                statusBadge.style.backgroundColor = 'var(--badge-storage)';
                statusBadge.style.color = 'var(--text-main)';
                document.body.style.backgroundColor = 'var(--bg-storage)';
            } else if (minutes >= 8 && minutes < 25) {
                statusBadge.innerText = '專注期';
                statusBadge.style.backgroundColor = 'var(--badge-focus)';
                statusBadge.style.color = '#FFFFFF';
                document.body.style.backgroundColor = 'var(--bg-focus)';
            } else {
                statusBadge.innerText = '心流期';
                statusBadge.style.backgroundColor = 'var(--badge-flow)';
                statusBadge.style.color = '#FFFFFF';
                document.body.style.backgroundColor = 'var(--bg-flow)';
            }
        }

        function displayTime(totalSecs) {
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;

            let timeStr = "";
            if (hrs > 0) {
                timeStr += `${String(hrs).padStart(2, '0')}:`;
            }
            timeStr += `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            timerDisplay.innerText = timeStr;
        }

        // --- 狀態轉換控制 ---
        function startFocus() {
            initAudio();
            stopAudioKeepAlive();
            currentState = STATE.FOCUS;
            startTime = Date.now();
            sessionStartDateTime = new Date(); 
            elapsedSeconds = 0;

            btnStartFocus.classList.add('hidden');
            btnEndFocus.classList.remove('hidden');
            btnStopAlarm.classList.add('hidden');
            btnSkipBreak.classList.add('hidden');

            timerWorker.postMessage('start');
            updateFocusUI();
        }

        function endFocus() {
            initAudio();
            timerWorker.postMessage('stop'); 
            
            const totalMinutes = elapsedSeconds / 60;

            if (totalMinutes < 8) {
                const proceed = confirm("目前處於蓄力期(未滿 8 分鐘），結束將不計入任何時間。\n\n確定要放棄並結束嗎？\n點擊「取消」可返回繼續蓄力。");
                if (!proceed) {
                    currentState = STATE.FOCUS;
                    timerWorker.postMessage('start');
                    return;
                }
                resetToIdle();
            } else {
                const sessionEndDateTime = new Date();
                recordStats(totalMinutes, sessionStartDateTime, sessionEndDateTime);
                
                let breakMinutes = 5;
                if (totalMinutes > 25) {
                    breakMinutes += Math.floor((totalMinutes - 0.001) / 25) * 5;
                }
                
                startBreak(breakMinutes);
            }
        }

        function startBreak(minutes) {
            currentState = STATE.BREAK;
            breakTotalSeconds = minutes * 60;
            startTime = Date.now();

            // 進入休息期：啟動音訊保活，預置 iPad 背景播放權限
            startAudioKeepAlive();

            statusBadge.innerText = `休息中 (${minutes}m)`;
            statusBadge.style.backgroundColor = 'var(--badge-break)';
            statusBadge.style.color = '#FFFFFF';
            document.body.style.backgroundColor = 'var(--bg-break)'; /* 變更為冰藍色，與專注工作完全區隔 */

            btnEndFocus.classList.add('hidden');
            btnSkipBreak.classList.remove('hidden');

            displayTime(breakTotalSeconds);
            timerWorker.postMessage('start');
        }

        function transitionToAlarm() {
            timerWorker.postMessage('stop');
            stopAudioKeepAlive(); // 關閉低頻保活音，改播真實鬧鐘
            
            currentState = STATE.ALARM;

            statusBadge.innerText = '休息結束！';
            statusBadge.style.backgroundColor = 'var(--badge-alarm)';
            statusBadge.style.color = '#FFFFFF';
            document.body.style.backgroundColor = 'var(--bg-alarm)';
            timerDisplay.innerText = "00:00";

            btnSkipBreak.classList.add('hidden');
            btnStopAlarm.classList.remove('hidden');

            startAlarmLoop();
        }

        function resetToIdle() {
            stopAlarmLoop();
            stopAudioKeepAlive();
            timerWorker.postMessage('stop');
            currentState = STATE.IDLE;

            statusBadge.innerText = '準備專注';
            statusBadge.style.backgroundColor = 'var(--badge-idle)';
            statusBadge.style.color = 'var(--text-main)';
            document.body.style.backgroundColor = 'var(--bg-idle)';
            timerDisplay.innerText = "00:00";

            btnStartFocus.classList.remove('hidden');
            btnEndFocus.classList.add('hidden');
            btnStopAlarm.classList.add('hidden');
            btnSkipBreak.classList.add('hidden');
        }

        // --- 時間進位進階工具 ---
        function formatMinutesToHTML(totalMins) {
            const mins = Math.round(totalMins);
            if (mins >= 60) {
                const hrs = Math.floor(mins / 60);
                const remMins = mins % 60;
                return `${hrs}<span>h</span> ${remMins}<span>m</span>`;
            }
            return `${mins}<span>m</span>`;
        }

        function formatMinutesToText(totalMins) {
            const mins = Math.round(totalMins);
            if (mins >= 60) {
                const hrs = Math.floor(mins / 60);
                const remMins = mins % 60;
                return remMins > 0 ? `${hrs}h ${remMins}m` : `${hrs}h`;
            }
            return `${mins}m`;
        }

        function formatTimeHM(dateObj) {
            const h = String(dateObj.getHours()).padStart(2, '0');
            const m = String(dateObj.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // --- 統計數據與歷史明細處理 ---
        function recordStats(totalMins, startTimeObj, endTimeObj) {
            const today = getTodayKey();
            let stats = JSON.parse(localStorage.getItem('tree_clock_data')) || {};

            if (!stats[today]) {
                stats[today] = { focus: 0, flow: 0, history: [] };
            }
            if (!stats[today].history) {
                stats[today].history = [];
            }

            let fTime = 0;
            let flTime = 0;

            if (totalMins <= 25) {
                fTime = totalMins;
            } else {
                fTime = 25;
                flTime = (totalMins - 25);
            }

            stats[today].focus += fTime;
            stats[today].flow += flTime;

            const startStr = formatTimeHM(startTimeObj);
            const endStr = formatTimeHM(endTimeObj);

            stats[today].history.push({
                start: startStr,
                end: endStr,
                focus: Math.round(fTime),
                flow: Math.round(flTime)
            });

            localStorage.setItem('tree_clock_data', JSON.stringify(stats));
            loadAndRenderStats();
        }

        function loadAndRenderStats() {
            const today = getTodayKey();
            const stats = JSON.parse(localStorage.getItem('tree_clock_data')) || {};
            const todayData = stats[today] || { focus: 0, flow: 0, history: [] };
            
            todayFocusEl.innerHTML = formatMinutesToHTML(todayData.focus);
            todayFlowEl.innerHTML = formatMinutesToHTML(todayData.flow);

            historyListEl.innerHTML = '';
            const history = todayData.history || [];
            
            if (history.length === 0) {
                historyListEl.innerHTML = '<div style="text-align:center; font-size:0.8rem; color:var(--text-sub); padding: 12px 0;">尚未建立今日紀錄</div>';
            } else {
                [...history].reverse().forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    
                    let label = `專注 ${formatMinutesToText(item.focus)}`;
                    if (item.flow > 0) {
                        label += ` + 心流 ${formatMinutesToText(item.flow)}`;
                    }
                    
                    li.innerHTML = `
                        <span class="history-time">⏱️ ${item.start} - ${item.end}</span>
                        <span class="history-detail">${label}</span>
                    `;
                    historyListEl.appendChild(li);
                });
            }
        }

        // --- 事件綁定 ---
        btnStartFocus.addEventListener('click', startFocus);
        btnEndFocus.addEventListener('click', endFocus);
        btnSkipBreak.addEventListener('click', resetToIdle);
        btnStopAlarm.addEventListener('click', () => {
            resetToIdle();
            startFocus();
        });

        loadAndRenderStats();
    </script>
</body>
</html>
